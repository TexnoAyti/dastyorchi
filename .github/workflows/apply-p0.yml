name: Apply P0 core correctness patch

on:
  push:
    branches:
      - fix/core-correctness-p0
    paths:
      - '.p0/**'
      - '.github/workflows/apply-p0.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/core-correctness-p0
          fetch-depth: 0

      - name: Reconstruct and verify patch
        shell: bash
        run: |
          cat .p0/p0.patch.part-* > /tmp/p0.patch
          git apply --check -p1 /tmp/p0.patch

      - name: Apply patch
        shell: bash
        run: |
          git apply --whitespace=nowarn -p1 /tmp/p0.patch
          rm -rf .p0
          rm -f .github/workflows/apply-p0.yml

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "dastyorchi-p0-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden core correctness and legal safety"
          git push origin HEAD:fix/core-correctness-p0
